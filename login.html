<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZANZI Giriş Yap</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .auth-box {
      max-width: 400px;
      width: 100%;
      padding: 40px;
      border: 1px solid #eee;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: black;
      color: white;
      border: none;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
    }
    p, a {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      color: #555;
      display: block;
    }
    #authMessage {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #d00;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h1>ZANZI Giriş Yap</h1>
    <form id="authForm">
      <input type="email" id="email" placeholder="E-posta" required />
      <input type="password" id="password" placeholder="Şifre" required />
      <button type="submit">Giriş Yap / Kayıt Ol</button>
    </form>
    <p><a href="register.html">Hesabınız yok mu? Kayıt olun</a></p>
    <p id="authMessage"></p>
  </div>

  <!-- 🔗 GÖMÜLÜ JS -->
  <script>
    document.getElementById("authForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("authMessage");

      if (!email || !password) {
        message.textContent = "Lütfen e-posta ve şifre giriniz.";
        return;
      }

      const key = "user_" + email;
      const stored = localStorage.getItem(key);

      if (stored) {
        const user = JSON.parse(stored);
        if (user.password === password) {
          localStorage.setItem("currentUser", email);
          message.style.color = "green";
          message.textContent = "Giriş başarılı. Yönlendiriliyorsunuz...";
          setTimeout(() => window.location.href = "index.html", 1000);
        } else {
          message.textContent = "Şifre yanlış.";
        }
      } else {
        const newUser = { email, password };
        localStorage.setItem(key, JSON.stringify(newUser));
        localStorage.setItem("currentUser", email);
        message.style.color = "green";
        message.textContent = "Kayıt başarılı. Giriş yapılıyor...";
        setTimeout(() => window.location.href = "index.html", 1000);
      }
    });
  </script>

</body>
</html>

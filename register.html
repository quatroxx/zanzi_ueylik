<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZANZI Kayıt Ol</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .auth-box {
      max-width: 400px;
      width: 100%;
      padding: 40px;
      border: 1px solid #eee;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: black;
      color: white;
      border: none;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
    }
    p, a {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      color: #555;
      display: block;
    }
    #registerMessage {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      color: #c00;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h1>ZANZI Kayıt Ol</h1>
    <form id="registerForm">
      <input type="email" id="email" placeholder="E-posta" required />
      <input type="password" id="password" placeholder="Şifre" required />
      <input type="password" id="confirmPassword" placeholder="Şifre Tekrar" required />
      <button type="submit">Kayıt Ol</button>
    </form>
    <p><a href="login.html">Zaten hesabınız var mı? Giriş yapın</a></p>
    <p id="registerMessage"></p>
  </div>

  <!-- 🔗 GÖMÜLÜ JS -->
  <script>
    document.getElementById("registerForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const message = document.getElementById("registerMessage");

      if (!email || !password || !confirmPassword) {
        message.textContent = "Lütfen tüm alanları doldurun.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Şifreler uyuşmuyor.";
        return;
      }

      const userKey = "user_" + email;
      if (localStorage.getItem(userKey)) {
        message.textContent = "Bu e-posta zaten kayıtlı.";
        return;
      }

      const newUser = { email, password };
      localStorage.setItem(userKey, JSON.stringify(newUser));
      message.style.color = "green";
      message.textContent = "Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...";

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1500);
    });
  </script>

</body>
</html>
